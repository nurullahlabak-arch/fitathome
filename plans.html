<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plans — FitAtHome</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .plans-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-bottom:40px; }
    .plan-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:all var(--transition); }
    .plan-card:hover { border-color:var(--accent); transform:translateY(-4px); box-shadow:var(--shadow); }
    .plan-card-header { padding:24px; background:var(--bg3); display:flex; align-items:center; gap:16px; }
    .plan-icon { font-size:48px; }
    .plan-title { font-size:18px; font-weight:800; }
    .plan-subtitle { font-size:13px; color:var(--text2); margin-top:4px; }
    .plan-card-body { padding:20px; }
    .plan-meta { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .plan-meta span { font-size:13px; color:var(--text2); }
    .plan-progress-wrap { margin-bottom:14px; }
    .plan-progress-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text2); margin-bottom:6px; }
    .plan-detail { display:none; }
    .plan-detail.open { display:block; animation:fadeIn 0.3s ease; }
    .day-list { display:flex; flex-direction:column; gap:8px; margin-top:16px; max-height:400px; overflow-y:auto; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><div class="nav-logo">F</div><span>FitAtHome</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="workouts.html">Workouts</a>
      <a href="exercises.html">Exercises</a><a href="progress.html">Progress</a><a href="profile.html">Profile</a>
    </div>
    <div class="nav-actions"><button class="theme-btn" onclick="toggleTheme()">🌙</button></div>
  </nav>

  <div class="page-wrapper">
    <div class="container section-sm">
      <div class="page-title">Workout Programs 📋</div>
      <div class="page-sub">Structured plans to keep you on track</div>
      <div class="plans-grid" id="plans-grid"></div>
    </div>
  </div>

  <!-- PLAN DETAIL MODAL -->
  <div class="modal-overlay" id="plan-modal" onclick="closePlanModal(event)">
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:36px" id="pm-icon"></div>
          <div><h3 id="pm-title"></h3><div style="font-size:13px;color:var(--text2)" id="pm-sub"></div></div>
        </div>
        <button class="modal-close" onclick="document.getElementById('plan-modal').classList.remove('open')">✕</button>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px">
        <span>📅 <span id="pm-days"></span> days</span>
        <span>🎯 <span id="pm-goal"></span></span>
        <span>⚡ <span id="pm-level"></span></span>
      </div>
      <div class="plan-progress-wrap">
        <div class="plan-progress-label"><span>Progress</span><span id="pm-pct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="pm-fill" style="width:0%"></div></div>
      </div>
      <div class="day-list" id="pm-days-list"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="bnav-icon">🏠</span>Home</a>
    <a href="workouts.html"><span class="bnav-icon">💪</span>Workouts</a>
    <a href="exercises.html"><span class="bnav-icon">📚</span>Exercises</a>
    <a href="progress.html"><span class="bnav-icon">📈</span>Progress</a>
    <a href="profile.html"><span class="bnav-icon">👤</span>Profile</a>
  </nav>

  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    function renderPlans() {
      const appData = getAppData();
      document.getElementById('plans-grid').innerHTML = PLANS.map(p => {
        const saved = appData.planProgress[p.id] || [];
        const pct = Math.round((saved.length / p.days.length) * 100);
        return `
        <div class="plan-card" onclick="openPlan(${p.id})">
          <div class="plan-card-header">
            <div class="plan-icon">${p.icon}</div>
            <div><div class="plan-title">${p.name}</div><div class="plan-subtitle">${p.goal}</div></div>
          </div>
          <div class="plan-card-body">
            <div class="plan-meta">
              <span>📅 ${p.days.length} days</span>
              <span>⚡ ${p.level}</span>
              <span>⏱️ ${p.duration} min/day</span>
            </div>
            <div class="plan-progress-wrap">
              <div class="plan-progress-label"><span>Progress</span><span>${pct}%</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
            <button class="btn btn-accent" style="width:100%">${saved.length > 0 ? 'Continue Plan' : 'Start Plan'}</button>
          </div>
        </div>`;
      }).join('');
    }

    function openPlan(id) {
      const p = PLANS.find(x => x.id === id);
      const appData = getAppData();
      const saved = appData.planProgress[p.id] || [];
      const pct = Math.round((saved.length / p.days.length) * 100);
      document.getElementById('pm-icon').textContent = p.icon;
      document.getElementById('pm-title').textContent = p.name;
      document.getElementById('pm-sub').textContent = p.description;
      document.getElementById('pm-days').textContent = p.days.length;
      document.getElementById('pm-goal').textContent = p.goal;
      document.getElementById('pm-level').textContent = p.level;
      document.getElementById('pm-pct').textContent = pct + '%';
      document.getElementById('pm-fill').style.width = pct + '%';
      document.getElementById('pm-days-list').innerHTML = p.days.map((d, i) => {
        const done = saved.includes(i);
        const locked = i > saved.length;
        return `
        <div class="plan-day ${done ? 'completed' : locked ? 'locked' : ''}" onclick="${!locked && !done ? `markDay(${p.id},${i})` : ''}">
          <div class="plan-day-num">${done ? '✓' : i + 1}</div>
          <div class="plan-day-info">
            <div class="plan-day-title">${d.name}</div>
            <div class="plan-day-meta">${d.duration} min · ${d.exercises} exercises · ${d.calories} cal</div>
          </div>
          ${done ? '<span class="badge badge-green">Done</span>' : locked ? '<span style="font-size:16px">🔒</span>' : '<button class="btn btn-accent btn-sm" onclick="event.stopPropagation();startPlanDay('+p.id+','+i+')">Start</button>'}
        </div>`;
      }).join('');
      document.getElementById('plan-modal').classList.add('open');
    }

    function markDay(planId, dayIdx) {
      const appData = getAppData();
      if (!appData.planProgress[planId]) appData.planProgress[planId] = [];
      if (!appData.planProgress[planId].includes(dayIdx)) appData.planProgress[planId].push(dayIdx);
      saveAppData(appData);
      showToast('Day marked complete! 🎉');
      document.getElementById('plan-modal').classList.remove('open');
      renderPlans();
    }

    function startPlanDay(planId, dayIdx) {
      localStorage.setItem('currentWorkout', '0');
      location.href = 'player.html';
    }

    function closePlanModal(e) { if (e.target === document.getElementById('plan-modal')) document.getElementById('plan-modal').classList.remove('open'); }

    renderPlans();
  </script>
</body>
</html>
